<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaxEdge Parlay Slip</title>
<meta name="description" content="View this RaxEdge parlay slip">
<style>
  :root {
    --bg:      #0b0b12;
    --bg2:     #13131f;
    --bg3:     #1a1a2e;
    --border:  #2a2a40;
    --text:    #e8e8f0;
    --muted:   #6b6b8a;
    --accent:  #4f6ef7;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  .brand {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none;
    margin-bottom: 24px;
  }
  .brand-name {
    font-size: 14px; font-weight: 800; letter-spacing: .06em; color: var(--text);
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 420px;
    overflow: hidden;
  }

  .card-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
  }

  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg3); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: var(--accent);
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .user-info { flex: 1; min-width: 0; }
  .username  { font-weight: 700; font-size: 15px; }
  .slip-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-badge {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    padding: 4px 10px; border-radius: 20px; text-transform: uppercase; flex-shrink: 0;
  }
  .status-badge.won     { background: rgba(34,197,94,.15);  color: var(--green); }
  .status-badge.lost    { background: rgba(239,68,68,.12);  color: var(--red); }
  .status-badge.active  { background: rgba(79,110,247,.15); color: var(--accent); }
  .status-badge.pending { background: rgba(107,107,138,.15);color: var(--muted); }

  .legs { padding: 4px 0; }
  .leg {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
  }
  .leg + .leg { border-top: 1px solid var(--border); }

  .leg-shot {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border);
    flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--muted); font-weight: 700; position: relative;
  }

  .leg-icon { font-size: 14px; flex-shrink: 0; }
  .leg-body { flex: 1; min-width: 0; }
  .leg-player { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leg-player.won  { color: var(--green); }
  .leg-player.lost { color: var(--red); }
  .leg-line   { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .leg-odds   { font-size: 12px; color: var(--accent); font-weight: 600; flex-shrink: 0; }

  /* Dual team logo avatar for team-market legs */
  .leg-shot.dual {
    background: transparent;
    border: none;
    overflow: visible;
  }
  .dual-logo-a, .dual-logo-b {
    position: absolute;
    width: 30px; height: 30px;
    border-radius: 50%;
    object-fit: contain;
    object-position: center;
    background: var(--bg3);
    border: 1.5px solid var(--border);
    padding: 3px;
  }
  .dual-logo-a { top: 0; left: 0; }
  .dual-logo-b { bottom: 0; right: 0; }

  /* Dual fighter headshots for UFC legs */
  .dual-head-a, .dual-head-b {
    position: absolute;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1.5px solid var(--border);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; color: var(--muted);
  }
  .dual-head-a { top: 0; left: 0; }
  .dual-head-b { bottom: 0; right: 0; }
  .dual-head-a img, .dual-head-b img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }

  .card-footer {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  }
  .stat { text-align: center; }
  .stat-val   { font-size: 16px; font-weight: 700; }
  .stat-val.green { color: var(--green); }
  .stat-val.blue  { color: var(--accent); }
  .stat-label {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }

  .rax-logo-inline {
    display: inline-flex; align-items: center; vertical-align: middle;
  }

  .share-area {
    width: 100%; max-width: 420px;
    margin: 12px auto 0;
  }
  .share-btn {
    display: block; width: 100%;
    padding: 12px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
    text-align: center; transition: color .15s, border-color .15s;
  }
  .share-btn:hover { color: var(--text); border-color: var(--accent); }
  .share-btn.copied { color: var(--green); border-color: var(--green); }

  .link-box {
    display: none;
    margin-top: 8px;
    width: 100%;
    padding: 10px 12px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 12px; font-family: monospace;
    outline: none; cursor: text;
    border-color: var(--green);
  }
  .link-box.visible { display: block; }

  .cta { margin-top: 24px; text-align: center; font-size: 13px; color: var(--muted); }
  .cta a { color: var(--accent); text-decoration: none; font-weight: 600; }

  .error-state { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 15px; }
  .error-state .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  .fp-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 10px;
    background: rgba(250,204,21,.12); color: var(--yellow); margin-left: 6px;
  }
</style>
</head>

  // ESPN search headshot loader — same logic as loadSlipHeadshotAsync in app.js
  const HS_CACHE = {};
  function loadHeadshot(id, name, sport) {
    if (HS_CACHE[name] === 'none') return;
    if (HS_CACHE[name]) { applyHeadshot(id, HS_CACHE[name]); return; }
    const legSport   = sport || 'mlb';
    const espnSport  = legSport === 'wnba' ? 'basketball' : legSport.startsWith('soccer') ? 'soccer' : legSport === 'ufc' ? 'mma' : 'baseball';
    const espnLeague = legSport === 'wnba' ? 'wnba'       : legSport.startsWith('soccer') ? 'soccer' : legSport === 'ufc' ? 'mma' : 'mlb';
    fetch('https://site.api.espn.com/apis/search/v2?query=' + encodeURIComponent(name) + '&limit=3&type=player&sport=' + espnSport, { signal: AbortSignal.timeout(5000) })
      .then(r => r.json())
      .then(d => {
        const group  = (d.results || []).find(r => r.type === 'player');
        const hit    = group && group.contents && group.contents[0];
        const espnId = hit ? ((hit.uid || '').split('~a:')[1] || '') : '';
        if (!espnId) { HS_CACHE[name] = 'none'; return; }
        const url = `https://a.espncdn.com/combiner/i?img=/i/headshots/${espnLeague}/players/full/${espnId}.png&w=350&h=254`;
        HS_CACHE[name] = url;
        applyHeadshot(id, url);
      })
      .catch(() => { HS_CACHE[name] = 'none'; });
  }
  function loadUfcHeadshot(elemId, fighterName) {
    if (!fighterName) return;
    const key = 'ufc:' + fighterName;
    if (HS_CACHE[key] === 'none') return;
    if (HS_CACHE[key]) { applyHeadshotToDiv(elemId, HS_CACHE[key]); return; }
    fetch('https://site.api.espn.com/apis/search/v2?query=' + encodeURIComponent(fighterName) + '&limit=3&type=player&sport=mma', { signal: AbortSignal.timeout(5000) })
      .then(r => r.json())
      .then(d => {
        const group  = (d.results || []).find(r => r.type === 'player');
        const hit    = group && group.contents && group.contents[0];
        const espnId = hit ? ((hit.uid || '').split('~a:')[1] || '') : '';
        if (!espnId) { HS_CACHE[key] = 'none'; return; }
        const url = 'https://a.espncdn.com/combiner/i?img=/i/headshots/mma/players/full/' + espnId + '.png&w=350&h=254';
        HS_CACHE[key] = url;
        applyHeadshotToDiv(elemId, url);
      })
      .catch(() => { HS_CACHE[key] = 'none'; });
  }
  function applyHeadshotToDiv(elemId, url) {
    const el = document.getElementById(elemId);
    if (!el) return;
    el.innerHTML = '<img src="' + escHtml(url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">';
  }

  function applyHeadshot(id, url) {
    const el = document.getElementById(id);
    if (!el) return;
    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onerror = () => img.remove();
    el.appendChild(img);
  }

  function render(slip) {
    const statusCls = ['won','lost','active'].includes(slip.status) ? slip.status : 'pending';
    const initial   = slip.rs_username ? slip.rs_username[0].toUpperCase() : '?';
    const avatarImg = slip.rs_avatar_url
      ? `<img src="${escHtml(slip.rs_avatar_url)}" alt="" onerror="this.style.display='none'">`
      : '';
    const dateStr = slip.deposited_at ? 'Placed ' + fmtDate(slip.deposited_at)
                  : slip.created_at   ? 'Created ' + fmtDate(slip.created_at) : '';
    const fpBadge = slip.is_free_play ? '<span class="fp-badge">FREE PLAY</span>' : '';

    const legsHtml = (slip.legs || []).map((leg, i) => {
      const mkt    = leg.market_type || '';
      const isTeamMkt = mkt.startsWith('team_') || mkt.startsWith('1inn_');
      const isUfc  = mkt.startsWith('ufc_') || leg.sport === 'ufc';
      const odds   = leg.american_odds != null
        ? `<span class="leg-odds">${escHtml(fmtOdds(leg.american_odds))}</span>` : '';
      const shotId = `leg-shot-${i}`;
      const words    = (leg.player_name || '').split(' ');
      const initials = ((words[0] ? words[0][0] : '') + (words.length > 1 ? words[words.length-1][0] || '' : '')).toUpperCase();

      let shotHtml;
      if (isTeamMkt) {
        let evtPts = (leg.event_name || '').match(/^(.+?)\s+@\s+(.+)$/);
        if (!evtPts && mkt === 'team_total') {
          evtPts = (leg.player_name || '').match(/^(.+?)\s+@\s+(.+?)\s+[OU][\d.]+$/);
        }
        let evtAway = evtPts ? evtPts[1].trim() : null;
        let evtHome = evtPts ? evtPts[2].trim() : null;
        let logoA = null, logoB = null;

        if (mkt === 'team_total' || mkt.startsWith('1inn_')) {
          if (mkt.startsWith('1inn_') && evtAway && evtHome) {
            logoA = 'https://a.espncdn.com/i/teamlogos/mlb/500/' + evtAway.toLowerCase() + '.png';
            logoB = 'https://a.espncdn.com/i/teamlogos/mlb/500/' + evtHome.toLowerCase() + '.png';
          } else {
            logoA = evtAway ? slipTeamLogo(evtAway, leg.sport) : null;
            logoB = evtHome ? slipTeamLogo(evtHome, leg.sport) : null;
          }
        } else if (mkt === 'team_runline') {
          const pickedN   = (leg.player_name || '').replace(/ (ML|RL)$/i, '').trim();
          const pickedNrm = normSlipName(pickedN);
          const awayNrm   = normSlipName(evtAway || '');
          const awayNick  = awayNrm.split(' ').slice(1).join(' ');
          const isAwayPk  = awayNrm === pickedNrm || (awayNick && pickedNrm.endsWith(awayNick));
          logoA = slipTeamLogo(isAwayPk ? evtAway : evtHome, leg.sport);
          logoB = slipTeamLogo(isAwayPk ? evtHome : evtAway, leg.sport);
        } else {
          const tmln = (leg.player_name || '').replace(/ (ML|RL)$/i, '').trim();
          logoA = slipTeamLogo(tmln, leg.sport);
          if (!logoA && (evtAway || evtHome)) {
            const tNrm  = normSlipName(tmln);
            const aNrm  = normSlipName(evtAway || '');
            const tLast = tNrm.split(' ').pop();
            const aLast = aNrm.split(' ').pop();
            const isAway = aNrm === tNrm || (tLast && tLast === aLast);
            logoA = isAway
              ? (slipTeamLogo(evtAway, leg.sport) || slipTeamLogo(evtHome, leg.sport))
              : (slipTeamLogo(evtHome, leg.sport) || slipTeamLogo(evtAway, leg.sport));
          }
        }

        if (logoA && logoB) {
          shotHtml = '<div class="leg-shot dual" id="' + shotId + '">' +
            '<img class="dual-logo-a" src="' + escHtml(logoA) + '" alt="" onerror="this.style.display=\'none\'">' +
            '<img class="dual-logo-b" src="' + escHtml(logoB) + '" alt="" onerror="this.style.display=\'none\'">' +
            '</div>';
        } else if (logoA) {
          shotHtml = `<div class="leg-shot" id="${shotId}"><img src="${escHtml(logoA)}" alt="" style="width:100%;height:100%;object-fit:contain;padding:4px" onerror="this.style.display='none'"></div>`;
        } else {
          shotHtml = `<div class="leg-shot" id="${shotId}">${escHtml(initials)}</div>`;
        }
      } else if (isUfc) {
        const vsMatch = (leg.player_name || '').match(/^(.+?)\s+vs\s+(.+?)(?:\s+[OU][\d.]+)?$/i)
          || (leg.event_name || '').match(/^(.+?)\s+vs\s+(.+)$/i);
        if (vsMatch) {
          const fa = vsMatch[1].trim(), fb = vsMatch[2].trim();
          shotHtml = '<div class="leg-shot dual" id="' + shotId + '">' +
            '<div class="dual-head-a" id="' + shotId + '-a">' + escHtml((fa[0] || '?').toUpperCase()) + '</div>' +
            '<div class="dual-head-b" id="' + shotId + '-b">' + escHtml((fb[0] || '?').toUpperCase()) + '</div>' +
            '</div>';
        } else {
          const storedImg = leg.headshot_url
            ? `<img src="${escHtml(leg.headshot_url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">`
            : '';
          shotHtml = `<div class="leg-shot" id="${shotId}">${escHtml((leg.player_name || '?')[0].toUpperCase())}${storedImg}</div>`;
        }
      } else {
        const storedImg = leg.headshot_url
          ? `<img src="${escHtml(leg.headshot_url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.remove()">`
          : '';
        shotHtml = `<div class="leg-shot" id="${shotId}">${escHtml((leg.player_name || '?')[0].toUpperCase())}${storedImg}</div>`;
      }

      return `<div class="leg">
        ${shotHtml}
        <span class="leg-icon">${legIcon(leg.status)}</span>
        <div class="leg-body">
          <div class="leg-player${leg.status === 'won' ? ' won' : leg.status === 'lost' ? ' lost' : ''}">${escHtml(leg.player_name)}</div>
          <div class="leg-line">${escHtml(leg.label || leg.direction || '')}${mkt && MKT_LABEL[mkt] ? ' · <span style="color:var(--accent);font-size:10px">' + escHtml(MKT_LABEL[mkt]) + '</span>' : ''}</div>
        </div>
        ${odds}
      </div>`;
    }).join('');

    const multi = slip.stake_rax ? (slip.payout_rax / slip.stake_rax).toFixed(1) + 'x' : '—';
    const payoutVal = slip.status === 'won'
      ? `<div class="stat-val green">+${fmt(slip.payout_rax)}</div>`
      : `<div class="stat-val blue">${fmt(slip.payout_rax)}</div>`;

    const raxLabel = `<span class="stat-label"><span class="rax-logo-inline">${RAX_LOGO_SVG}</span></span>`;

    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="avatar">${escHtml(initial)}${avatarImg}</div>
          <div class="user-info">
            <div class="username">@${escHtml(slip.rs_username)}${fpBadge}</div>
            <div class="slip-meta">${escHtml(dateStr)} · ${slip.legs_count}-leg parlay</div>
          </div>
          <div class="status-badge ${statusCls}">${statusLabel(slip.status)}</div>
        </div>
        <div class="legs">${legsHtml}</div>
        <div class="card-footer">
          <div class="stat">
            <div class="stat-val">${fmt(slip.stake_rax)}</div>
            <div class="stat-label">Stake ${RAX_LOGO_SVG}</div>
          </div>
          <div class="stat">
            <div class="stat-val">${multi}</div>
            <div class="stat-label">Multiplier</div>
          </div>
          <div class="stat">
            ${payoutVal}
            <div class="stat-label">Payout ${RAX_LOGO_SVG}</div>
          </div>
        </div>
      </div>
      <div class="share-area">
        <button class="share-btn" id="copy-btn" onclick="copyLink()">🔗 Copy link</button>
        <input class="link-box" id="link-box" type="text" readonly onclick="this.select()" value="${escHtml(window.location.href)}">
      </div>
      <div class="cta">Find +EV parlays at <a href="https://raxedge.com">raxedge.com</a></div>
    `;

    // Async-load headshots for player prop and UFC legs
    (slip.legs || []).forEach((leg, i) => {
      const mkt = leg.market_type || '';
      const isTeamMkt = mkt.startsWith('team_') || mkt.startsWith('1inn_');
      const isUfc = mkt.startsWith('ufc_') || leg.sport === 'ufc';
      if (isTeamMkt) return;
      if (isUfc) {
        const vsMatch = (leg.player_name || '').match(/^(.+?)\s+vs\s+(.+?)(?:\s+[OU][\d.]+)?$/i)
          || (leg.event_name || '').match(/^(.+?)\s+vs\s+(.+)$/i);
        if (vsMatch) {
          loadUfcHeadshot(`leg-shot-${i}-a`, vsMatch[1].trim());
          loadUfcHeadshot(`leg-shot-${i}-b`, vsMatch[2].trim());
        } else {
          loadHeadshot(`leg-shot-${i}`, leg.player_name, leg.sport);
        }
        return;
      }
      if (!leg.headshot_url && leg.player_name) {
        loadHeadshot(`leg-shot-${i}`, leg.player_name, leg.sport);
      }
    });
  }

  function copyLink() {
    const url = window.location.href;
    const btn = document.getElementById('copy-btn');
    const box = document.getElementById('link-box');

    // Show the link box
    if (box) { box.classList.add('visible'); box.select(); }

    navigator.clipboard.writeText(url).then(() => {
      if (!btn) return;
      btn.textContent = '✅ Copied to clipboard!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '🔗 Copy link'; btn.classList.remove('copied'); }, 2500);
    }).catch(() => {
      // Clipboard denied (common on iOS) — box is already visible so user can copy manually
      if (btn) btn.textContent = '🔗 Copy link';
    });
  }

  async function init() {
    const token = new URLSearchParams(window.location.search).get('t');
    if (!token) {
      document.getElementById('root').innerHTML = '<div class="error-state"><span class="emoji">🤔</span>Slip not found.</div>';
      return;
    }
    try {
      const res  = await fetch('/api/parlays/slip-public?token=' + encodeURIComponent(token));
      if (!res.ok) throw new Error();
      const slip = await res.json();
      render(slip);
    } catch {
      document.getElementById('root').innerHTML = '<div class="error-state"><span class="emoji">🤔</span>Slip not found or no longer available.</div>';
    }
  }

  init();
</script>
</body>
</html>
