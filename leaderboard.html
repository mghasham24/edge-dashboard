<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Earners — RaxEdge Parlays</title>
<meta name="description" content="See who's up the most on RaxEdge Parlays. Updated every 5 minutes.">
<meta property="og:title" content="RaxEdge Parlays — Top Earners">
<meta property="og:description" content="Real Sports parlay leaderboard. Who's cashing?">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0b0b12;
    --surface: #13131e;
    --border:  rgba(255,255,255,.08);
    --accent:  #4f6ef7;
    --green:   #22c55e;
    --text:    #f0eff5;
    --text2:   #a0a0be;
    --muted:   #5a5a7a;
    --gold:    #f59e0b;
    --silver:  #94a3b8;
    --bronze:  #cd7c43;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 48px;
  }

  .header {
    width: 100%;
    max-width: 480px;
    padding: 40px 0 28px;
    text-align: center;
  }
  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -.3px;
  }
  .header h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: var(--text2);
  }

  /* Period toggle */
  .toggle-wrap {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }
  .toggle {
    display: inline-flex;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .toggle-btn {
    padding: 7px 18px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
    font-family: inherit;
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* Window info pill */
  .window-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(79,110,247,.12);
    border: 1px solid rgba(79,110,247,.25);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }
  .window-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  /* Board */
  .board {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color .15s;
    overflow: hidden;
  }
  .row-wrap:hover { border-color: rgba(79,110,247,.3); }
  .row-wrap.top1 { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.05); }
  .row-wrap.top2 { border-color: rgba(148,163,184,.2); }
  .row-wrap.top3 { border-color: rgba(205,124,67,.2); }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .chevron {
    font-size: 16px;
    color: var(--muted);
    transition: transform .2s;
    flex-shrink: 0;
    line-height: 1;
  }
  .row-wrap.open .chevron { transform: rotate(90deg); }

  .slips-panel {
    display: none;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .row-wrap.open .slips-panel { display: flex; }

  .slip-item {
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .slip-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .slip-profit {
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
  }
  .slip-info {
    font-size: 11px;
    color: var(--muted);
  }
  .slip-legs-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .slip-leg {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .slip-leg-player {
    color: var(--green);
    font-weight: 600;
  }
  .slip-leg-detail {
    display: flex;
    gap: 6px;
    align-items: baseline;
    color: var(--text2);
  }
  .slip-leg-line { flex-shrink: 0; }
  .slip-leg-odds {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .slips-more-btn {
    width: 100%;
    margin-top: 4px;
    padding: 8px;
    background: rgba(79,110,247,.08);
    border: 1px solid rgba(79,110,247,.2);
    border-radius: 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  .slips-more-btn:hover { background: rgba(79,110,247,.15); }

  .rank {
    width: 28px;
    text-align: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .rank-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  .avatar {
    position: relative;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    font-weight: 800;
    flex-shrink: 0;
    background: rgba(79,110,247,.18);
    color: var(--accent);
    overflow: hidden;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .row-wrap.top1 .avatar { background: rgba(245,158,11,.18); color: var(--gold); }
  .row-wrap.top2 .avatar { background: rgba(148,163,184,.12); color: var(--silver); }
  .row-wrap.top3 .avatar { background: rgba(205,124,67,.14); color: var(--bronze); }

  .info { flex: 1; min-width: 0; }
  .username {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .record {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .record b { color: var(--green); }

  .profit {
    text-align: right;
    flex-shrink: 0;
  }
  .profit-amount {
    font-size: 16px;
    font-weight: 800;
    color: var(--green);
    font-variant-numeric: tabular-nums;
  }
  .profit-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    text-align: right;
  }

  .state-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    color: var(--text2);
    font-size: 14px;
    line-height: 1.6;
  }
  .state-card .emoji { font-size: 32px; display: block; margin-bottom: 12px; }

  .skeleton-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .skel {
    background: rgba(255,255,255,.06);
    border-radius: 6px;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { opacity: .5; }
    50%      { opacity: 1; }
  }

  .updated-at {
    width: 100%;
    max-width: 480px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
  }

  .cta {
    width: 100%;
    max-width: 480px;
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
  }
  .cta p {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .cta p strong { color: var(--text); }
  .cta-btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: .2px;
    transition: opacity .15s;
  }
  .cta-btn:hover { opacity: .88; }

  /* Weekly rewards banner */
  .rewards-banner {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(135deg, rgba(245,158,11,.12) 0%, rgba(79,110,247,.08) 100%);
    border: 1px solid rgba(245,158,11,.25);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 4px;
  }
  .rewards-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .rewards-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .reward-item {
    flex: 1;
    text-align: center;
    background: rgba(0,0,0,.2);
    border-radius: 10px;
    padding: 10px 6px;
  }
  .reward-medal { font-size: 20px; line-height: 1; }
  .reward-amount {
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .reward-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }
  .rewards-banner.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">RaxEdge Parlays</div>
  <h1>Top Earners<br><span id="header-span">This Week</span></h1>
  <p class="subtitle">Real Sports parlay leaderboard · ranked by total winnings</p>
  <div class="toggle-wrap">
    <div class="toggle">
      <button class="toggle-btn active" id="btn-weekly" onclick="setPeriod('weekly')">7 Days</button>
      <button class="toggle-btn"        id="btn-alltime" onclick="setPeriod('alltime')">All Time</button>
    </div>
  </div>
  <div class="window-pill" id="window-pill">
    <span class="dot"></span>
    <span id="pill-text">Loading…</span>
  </div>
</div>

<div class="rewards-banner" id="rewards-banner">
  <div class="rewards-title">Weekly Prize Pool</div>
  <div class="rewards-row">
    <div class="reward-item">
      <div class="reward-medal">🥇</div>
      <div class="reward-amount">5,000</div>
      <div class="reward-label">Rax</div>
    </div>
    <div class="reward-item">
      <div class="reward-medal">🥈</div>
      <div class="reward-amount">2,500</div>
      <div class="reward-label">Rax</div>
    </div>
    <div class="reward-item">
      <div class="reward-medal">🥉</div>
      <div class="reward-amount">1,000</div>
      <div class="reward-label">Rax</div>
    </div>
  </div>
</div>

<div class="board" id="board">
  <div class="skeleton-row">
    <div class="skel" style="width:28px;height:28px;border-radius:50%"></div>
    <div class="skel" style="width:38px;height:38px;border-radius:50%"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div class="skel" style="height:14px;width:60%"></div>
      <div class="skel" style="height:11px;width:35%"></div>
    </div>
    <div class="skel" style="width:70px;height:18px"></div>
  </div>
  <div class="skeleton-row">
    <div class="skel" style="width:28px;height:28px;border-radius:50%"></div>
    <div class="skel" style="width:38px;height:38px;border-radius:50%"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div class="skel" style="height:14px;width:50%"></div>
      <div class="skel" style="height:11px;width:30%"></div>
    </div>
    <div class="skel" style="width:58px;height:18px"></div>
  </div>
  <div class="skeleton-row">
    <div class="skel" style="width:28px;height:28px;border-radius:50%"></div>
    <div class="skel" style="width:38px;height:38px;border-radius:50%"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div class="skel" style="height:14px;width:55%"></div>
      <div class="skel" style="height:11px;width:28%"></div>
    </div>
    <div class="skel" style="width:52px;height:18px"></div>
  </div>
</div>

<div class="updated-at" id="updated-at"></div>

<div class="cta">
  <p>Place parlays on Real Sports market odds.<br><strong>Verify your account to get started.</strong></p>
  <a class="cta-btn" href="https://raxedge.com">Join RaxEdge →</a>
</div>

<script>
  const MEDALS = ['🥇', '🥈', '🥉'];
  var activePeriod = 'weekly';
  var lastResults = [];

  function fmt(n) { return n.toLocaleString('en-US'); }

  function fmtDate(ts) {
    return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function wrapClass(i) {
    if (i === 0) return 'row-wrap top1';
    if (i === 1) return 'row-wrap top2';
    if (i === 2) return 'row-wrap top3';
    return 'row-wrap';
  }

  function rankEl(i) {
    if (i < 3) return '<div class="rank">' + MEDALS[i] + '</div>';
    return '<div class="rank"><span class="rank-num">' + (i + 1) + '</span></div>';
  }

  var MARKET_LABELS = {
    // MLB batter
    hits: 'Hits', home_runs: 'Home Runs', rbis: 'RBIs', hrbi: 'H+R+RBI',
    total_bases: 'Total Bases', singles: 'Singles', doubles: 'Doubles',
    walks: 'Walks', stolen_bases: 'Stolen Bases', runs: 'Runs',
    // MLB pitcher
    pitcher_ks: 'Strikeouts', outs_ou: 'Outs', hits_allowed: 'Hits Allowed',
    er_allowed: 'ER Allowed', bb_allowed: 'BB Allowed', hwer: 'H+W+ER',
    // 1st inning
    '1inn_ml': '1st Inn Winner', '1inn_runs_ou': '1st Inn Runs', '1inn_runs_exact': '1st Inn Runs',
    '1inn_hits_ou': '1st Inn Hits', '1inn_hits_exact': '1st Inn Hits',
    '1inn_run_yn': '1st Inn Score', '1inn_walks_ou': '1st Inn Walks',
    '1inn_pitches_ou': '1st Inn Pitches', '1inn_batters_ou': '1st Inn Batters',
    '1inn_hr_yn': '1st Inn HR', '1inn_ks': '1st Inn Ks',
    // Team lines
    team_ml: 'Moneyline', team_runline: 'Run Line', team_total: 'Team Total',
    // WNBA / NBA
    pts: 'Points', reb: 'Rebounds', ast: 'Assists', fg3m: '3-Pointers',
    pra: 'PRA', pa: 'Pts+Ast', pr: 'Pts+Reb', ra: 'Reb+Ast',
    double_double: 'Double-Double', triple_double: 'Triple-Double',
    steals: 'Steals', blocks: 'Blocks', turnovers: 'Turnovers',
    points: 'Points', rebounds: 'Rebounds', assists: 'Assists',
    // Soccer
    goalscorer: 'Goalscorer', sot: 'Shots on Target', saves: 'GK Saves',
    offsides: 'Offsides', fouls_won: 'Fouls Won',
    // UFC
    ufc_ml: 'Fighter ML', ufc_total: 'Fight Total',
  };

  function marketLabel(mt) {
    if (!mt) return '';
    return MARKET_LABELS[mt] || mt.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

  // Strip leading city abbreviation: "MIL Brewers" → "Brewers", "LA Dodgers" → "Dodgers"
  function stripCityAbbr(s) {
    return s.replace(/^[A-Z]{2,3}\s+/, '');
  }

  // Clean team_total player_name: "MIL Brewers @ LA Dodgers O8" → "Brewers @ Dodgers"
  function cleanTeamName(name, mt) {
    if (mt === 'team_total') {
      var m = name.match(/^([A-Z]{2,3}\s+.+?)\s+@\s+([A-Z]{2,3}\s+.+?)\s+[OU][\d.]+$/i);
      if (m) return stripCityAbbr(m[1].trim()) + ' @ ' + stripCityAbbr(m[2].trim());
    }
    return stripCityAbbr(name);
  }

  function fmtOdds(n) {
    return n > 0 ? '+' + n : String(n);
  }

  function fmtLegLine(leg) {
    var mkt = marketLabel(leg.market_type);
    var line = '';
    if (leg.direction && leg.threshold != null) {
      var dir = leg.direction === 'more' ? 'Over' : 'Under';
      line = dir + ' ' + leg.threshold;
    } else if (leg.label) {
      line = leg.label;
    }
    return mkt ? (mkt + (line ? ' · ' + line : '')) : line;
  }

  var SLIPS_PAGE_SIZE = 3;

  function renderSlips(slips, expanded) {
    if (!slips || !slips.length) return '';
    var show = expanded ? slips.length : Math.min(SLIPS_PAGE_SIZE, slips.length);
    var html = '<div class="slips-panel">';
    for (var i = 0; i < show; i++) {
      var s = slips[i];
      html += '<div class="slip-item">';
      html += '<div class="slip-meta">';
      html +=   '<span class="slip-profit">+' + fmt(s.payout_rax) + ' Rax</span>';
      html +=   '<span class="slip-info">' + s.legs_count + '-leg · ' + fmtDate(s.deposited_at) + '</span>';
      html += '</div>';
      html += '<div class="slip-legs-list">';
      for (var j = 0; j < s.legs.length; j++) {
        var leg = s.legs[j];
        html += '<div class="slip-leg">';
        html += '<span class="slip-leg-player">' + escHtml(cleanTeamName(leg.player_name, leg.market_type)) + '</span>';
        html += '<div class="slip-leg-detail"><span class="slip-leg-line">' + escHtml(fmtLegLine(leg)) + '</span><span class="slip-leg-odds">' + fmtOdds(leg.american_odds) + '</span></div>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    if (!expanded && slips.length > SLIPS_PAGE_SIZE) {
      var rem = slips.length - SLIPS_PAGE_SIZE;
      html += '<button class="slips-more-btn" onclick="event.stopPropagation();expandSlips(this,' + slips.length + ')">Show ' + rem + ' more win' + (rem === 1 ? '' : 's') + ' ›</button>';
    }
    html += '</div>';
    return html;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleRow(el) {
    el.classList.toggle('open');
  }

  function expandSlips(btn, total) {
    var panel = btn.closest('.slips-panel');
    var wrap  = btn.closest('.row-wrap');
    if (!panel || !wrap) return;
    // Find the result entry by index in the board
    var board   = document.getElementById('board');
    var wraps   = Array.from(board.querySelectorAll('.row-wrap'));
    var idx     = wraps.indexOf(wrap);
    if (idx < 0 || !lastResults || !lastResults[idx]) return;
    panel.outerHTML = renderSlips(lastResults[idx].slips, true);
  }

  function fmtWeekday(ts) {
    return new Date(ts * 1000).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/New_York' });
  }

  function updateHeader(period, windowStart, windowEnd, generatedAt) {
    var span = document.getElementById('header-span');
    var pill = document.getElementById('pill-text');
    var banner = document.getElementById('rewards-banner');
    if (period === 'alltime') {
      span.textContent = 'All Time';
      pill.textContent = 'All time · updates every 10 min';
      if (banner) banner.classList.add('hidden');
    } else {
      span.textContent = 'This Week';
      var from = fmtWeekday(windowStart);
      var to   = fmtWeekday((windowEnd || (windowStart + 604800)) - 1);
      pill.textContent = from + ' – ' + to + ' · updates every 5 min';
      if (banner) banner.classList.remove('hidden');
    }
    document.getElementById('btn-weekly').classList.toggle('active',  period === 'weekly');
    document.getElementById('btn-alltime').classList.toggle('active', period === 'alltime');
  }

  function render(results, period, windowStart, windowEnd, generatedAt) {
    lastResults = results;
    const board = document.getElementById('board');
    if (!results.length) {
      var msg = period === 'weekly' ? 'No results yet this week.<br>Be the first to cash a parlay!' : 'No all-time results yet.';
      board.innerHTML = '<div class="state-card"><span class="emoji">📊</span>' + msg + '</div>';
    } else {
      board.innerHTML = results.map((r, i) => {
        var hasSlips = r.slips && r.slips.length > 0;
        return '<div class="' + wrapClass(i) + '" onclick="toggleRow(this)">' +
          '<div class="row">' +
            rankEl(i) +
            '<div class="avatar">' + escHtml(r.rs_username[0].toUpperCase()) +
              (r.rs_avatar_url ? '<img src="' + escHtml(r.rs_avatar_url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' :
               r.rs_user_id    ? '<img src="/api/parlays/avatar?uid=' + encodeURIComponent(r.rs_user_id) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
            '</div>' +
            '<div class="info">' +
              '<div class="username">@' + escHtml(r.rs_username) + '</div>' +
              '<div class="record"><b>' + r.wins + 'W</b> / ' + r.losses + 'L</div>' +
            '</div>' +
            '<div class="profit">' +
              '<div class="profit-amount">+' + fmt(r.total_winnings) + '</div>' +
              '<div class="profit-label">Rax won</div>' +
            '</div>' +
            (hasSlips ? '<span class="chevron">›</span>' : '') +
          '</div>' +
          (hasSlips ? renderSlips(r.slips, false) : '') +
        '</div>';
      }).join('');
    }
    updateHeader(period, windowStart, windowEnd, generatedAt);
  }

  function timeAgo(ts) {
    const diff = Math.floor(Date.now() / 1000) - ts;
    if (diff < 60)  return 'just now';
    if (diff < 120) return '1 minute ago';
    return Math.floor(diff / 60) + ' minutes ago';
  }

  async function load(period) {
    try {
      const res  = await fetch('/api/parlays/leaderboard?period=' + period);
      const data = await res.json();
      if (period !== activePeriod) return; // switched while fetching
      render(data.results || [], data.period || period, data.windowStart, data.windowEnd, data.generatedAt);
      if (data.generatedAt) {
        document.getElementById('updated-at').textContent = 'Updated ' + timeAgo(data.generatedAt);
      }
    } catch {
      if (period !== activePeriod) return;
      document.getElementById('board').innerHTML =
        '<div class="state-card"><span class="emoji">⚠️</span>Could not load leaderboard.<br>Try refreshing.</div>';
    }
  }

  function setPeriod(period) {
    if (period === activePeriod) return;
    activePeriod = period;
    document.getElementById('btn-weekly').classList.toggle('active',  period === 'weekly');
    document.getElementById('btn-alltime').classList.toggle('active', period === 'alltime');
    document.getElementById('header-span').textContent = period === 'alltime' ? 'All Time' : 'This Week';
    document.getElementById('pill-text').textContent = 'Loading…';
    document.getElementById('board').innerHTML = ['','',''].map(() => `
      <div class="skeleton-row">
        <div class="skel" style="width:28px;height:28px;border-radius:50%"></div>
        <div class="skel" style="width:38px;height:38px;border-radius:50%"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <div class="skel" style="height:14px;width:55%"></div>
          <div class="skel" style="height:11px;width:32%"></div>
        </div>
        <div class="skel" style="width:64px;height:18px"></div>
      </div>
    `).join('');
    load(period);
  }

  load('weekly');
  setInterval(() => load(activePeriod), 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(activePeriod); });
</script>
</body>
</html>
